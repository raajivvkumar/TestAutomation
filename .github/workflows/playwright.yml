name: Portfolio Playwright Tests

# Opt-in only: do not spend GitHub Actions minutes on pushes or pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio:
    name: Chromium public demo E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run synthetic portfolio tests
        run: npm run test:portfolio -- --project=chromium

      - name: Generate Allure report (when results exist)
        if: always()
        run: |
          if [ -d allure-results ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results to generate"
          fi

      - name: Upload sanitized portfolio reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-playwright-reports
          path: |
            playwright-report/
            allure-report/
          retention-days: 7
          if-no-files-found: ignore
